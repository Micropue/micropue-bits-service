        - apiVersion
        - docs
        - openapi
      properties:
        name:
          type: string
          const: BITS Open API
        version:
          type: string
          const: v1
        apiVersion:
          type: string
          const: 1.0.0
        docs:
          type: string
          format: uri
        openapi:
          type: string
          format: uri
    ErrorIssue:
      type: object
      required:
        - path
        - message
      properties:
        path:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      description: RFC 9457 problem details with BITS-specific extensions.
      required:
        - type
        - title
        - status
        - code
        - detail
        - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        detail:
          type: string
        requestId:
          type: string
          pattern: ^req_[a-f0-9]{32}$
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorIssue"
        requiredPermission:
          $ref: "#/components/schemas/Permission"
        retryAfter:
          type: integer
          minimum: 1
