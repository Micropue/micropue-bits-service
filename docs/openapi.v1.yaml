openapi: 3.1.0
info:
  title: BITS Open API
  version: 1.0.0
  summary: Manage your own BITS snippets and groups with an API Key.
  description: >-
    The BITS Open API is a versioned, API-key-authenticated interface for managing the content owned
    by the key's account. It can read, create, update and soft-delete snippets, and read, create,
    update and delete groups. It cannot change account profile, email, password, two-factor
    authentication, Passkeys, followers, favorites, OAuth grants or other security settings. API
    Keys are account-level credentials and are not tied to an App.


    Send the key as `Authorization: Bearer bits_sk_YOUR_KEY` or `X-API-Key: bits_sk_YOUR_KEY`. Site
    cookies and OAuth access tokens are not accepted. Read requests are limited to 120 per minute
    per key and write requests to 30 per minute per key. An account-wide limit of 240 reads and 60
    writes per minute applies across all of the account's keys. Invalid authentication attempts are
    limited to 30 per minute per IP address. Rate limiting fails closed when the rate-limit store is
    unavailable.


    Errors use RFC 9457 `application/problem+json`. Every API response includes `X-Request-Id`
    and `X-API-Version: v1`. Requests that reach a rate limiter also include the current quota,
    remaining requests and reset delay in both the legacy `X-RateLimit-*` and standard
    `RateLimit-*` header families. Rate-limited responses also include `Retry-After`.
  contact:
    name: BITS
    url: https://bits.micropue.com.cn/docs/developer/api-keys
servers:
  - url: https://bits.micropue.com.cn/api/v1
    description: Production
externalDocs:
  description: BITS developer documentation
  url: https://bits.micropue.com.cn/docs/developer/open-api
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Meta
    description: Public API discovery and OpenAPI metadata
  - name: Account
    description: Identity and permission information for the current API key
  - name: Snippets
    description: Create and manage snippets owned by the API key's account
  - name: Groups
    description: Create and manage groups owned by the API key's account
paths:
  /:
    get:
      tags:
        - Meta
      summary: Get API information
      description: Returns the API name, version, human documentation URL and OpenAPI document URL. This
        endpoint does not require authentication and is limited to 60 requests per minute per client IP.
      operationId: getApiInfo
      security: []
      responses:
        "200":
          description: API metadata
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfoResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /openapi.json:
    get:
      tags:
        - Meta
      summary: Get the OpenAPI document
      description: Returns this OpenAPI 3.1 document. The same document is available at `/openapi.json`
        for tooling that expects the file at the origin root. This endpoint is limited to 60 requests
        per minute per client IP.
      operationId: getOpenApiDocument
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /me:
    get:
      tags:
        - Account
      summary: Get the current API identity
      description: Returns the account and API key represented by the supplied key. Requires `content:read`.
      operationId: getCurrentIdentity
      x-bits-permission: content:read
      responses:
        "200":
          description: Current identity and key metadata
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /snippets:
    get:
      tags:
        - Snippets
      summary: List your snippets
      description: Lists non-deleted snippets owned by the API key's account, including private and
        unlisted snippets. List items are summaries and do not include the code body; fetch one
        snippet to read its code. Requires `content:read`.
      operationId: listSnippets
      x-bits-permission: content:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Visibility"
      responses:
        "200":
          description: A page of snippets
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnippetListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - Snippets
      summary: Create a snippet
      description: Creates a snippet owned by the API key's account. Requires `content:create`. If `slug`
        is omitted, a URL name is generated from the name; a numeric suffix is added when needed.
        Public and unlisted content require the account to have a username set.
      operationId: createSnippet
      x-bits-permission: content:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnippetRequest"
      responses:
        "201":
          description: Snippet created
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnippetWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /snippets/{slug}:
    parameters:
      - $ref: "#/components/parameters/SnippetSlug"
    get:
      tags:
        - Snippets
      summary: Get one of your snippets
      description: Returns a snippet owned by the API key's account, including its code body. Requires
        `content:read`.
      operationId: getSnippet
      x-bits-permission: content:read
      responses:
        "200":
          description: Snippet detail
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnippetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags:
        - Snippets
      summary: Update or rename a snippet
      description: Partially updates a snippet owned by the API key's account. Omitted fields keep their
        current values. Sending `slug` renames the URL name; the old public URL redirects to the new
        one. Requires `content:update`.
      operationId: updateSnippet
      x-bits-permission: content:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSnippetRequest"
      responses:
        "200":
          description: Updated snippet
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnippetWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Snippets
      summary: Soft-delete a snippet
      description: Soft-deletes a snippet owned by the API key's account. Requires `content:delete`.
      operationId: deleteSnippet
      x-bits-permission: content:delete
      responses:
        "200":
          description: Snippet deleted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /groups:
    get:
      tags:
        - Groups
      summary: List your groups
      description: Lists non-deleted groups owned by the API key's account. Requires `content:read`.
      operationId: listGroups
      x-bits-permission: content:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Visibility"
      responses:
        "200":
          description: A page of groups
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - Groups
      summary: Create a group
      description: Creates a group owned by the API key's account. Requires `content:create`. If `slug` is
        omitted, a URL name is generated from the name; a numeric suffix is added when needed.
        Public and unlisted content require the account to have a username set.
      operationId: createGroup
      x-bits-permission: content:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /groups/{slug}:
    parameters:
      - $ref: "#/components/parameters/GroupSlug"
    get:
      tags:
        - Groups
      summary: Get one of your groups
      description: Returns a group owned by the API key's account. Requires `content:read`.
      operationId: getGroup
      x-bits-permission: content:read
      responses:
        "200":
          description: Group detail
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags:
        - Groups
      summary: Update or rename a group
      description: Partially updates a group owned by the API key's account. Omitted fields keep their
        current values. Sending `slug` renames the URL name; the old public URL redirects to the new
        one. Requires `content:update`.
      operationId: updateGroup
      x-bits-permission: content:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: Updated group
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Groups
      summary: Delete a group
      description: Deletes a group owned by the API key's account. Snippets inside the group are kept and
        lose their group association. Requires `content:delete`.
      operationId: deleteGroup
      x-bits-permission: content:delete
      responses:
        "200":
          description: Group deleted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bits_sk
      description: "Send the full account-level API key as `Authorization: Bearer bits_sk_<your-key>`.
        Session cookies and OAuth access tokens are rejected."
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Send the full account-level API key in the `X-API-Key` header. This is an alternative
        to Bearer authentication.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum records to return. Defaults to 20.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Offset:
      name: offset
      in: query
      description: Number of records to skip. Defaults to 0; values above 10,000 are rejected.
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Search:
      name: q
      in: query
      description: Case-insensitive search over name and intro. Maximum 200 characters.
      required: false
      schema:
        type: string
        maxLength: 200
    Visibility:
      name: visibility
      in: query
      description: Return only content with this visibility.
      required: false
      schema:
        $ref: "#/components/schemas/Visibility"
    SnippetSlug:
      name: slug
      in: path
      description: The snippet's URL name.
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 40
    GroupSlug:
      name: slug
      in: path
      description: The group's URL name.
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 40
  headers:
    X-Request-Id:
      description: Unique request identifier used in logs and RFC 9457 problem responses.
      schema:
        type: string
        example: req_4c94234bc6e04e2d9e7c17586e03c639
    X-API-Version:
      description: Version of the BITS Open API that served the request.
      schema:
        type: string
        const: v1
    X-RateLimit-Limit:
      description: Request limit for the current read or write bucket.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Seconds until the current rate-limit window resets.
      schema:
        type: integer
    RateLimit-Limit:
      description: Standard rate-limit header containing the request limit for the current bucket.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Standard rate-limit header containing the requests remaining in the current window.
      schema:
        type: integer
    RateLimit-Reset:
      description: Standard rate-limit header containing the seconds until the current window resets.
      schema:
        type: integer
    Retry-After:
      description: Seconds until the rate-limit window resets.
      schema:
        type: integer
