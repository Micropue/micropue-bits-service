  schemas:
    Visibility:
      type: string
      enum:
        - public
        - unlisted
        - private
    Permission:
      type: string
      enum:
        - content:read
        - content:create
        - content:update
        - content:delete
    Tag:
      type: object
      required:
        - key
        - name
      properties:
        key:
          type: string
        name:
          type: string
    Language:
      type: object
      required:
        - slug
        - name
        - logoUrl
      properties:
        slug:
          type: string
        name:
          type: string
        logoUrl:
          type:
            - string
            - "null"
    Dependency:
      type: object
      required:
        - slug
        - name
        - kind
      properties:
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - framework
            - library
            - tool
            - runtime
    GroupReference:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
    SnippetSummary:
      type: object
      description: A snippet without its code body. Used by list responses to keep payloads small.
      required:
        - sid
        - slug
        - name
        - intro
        - visibility
        - language
        - group
        - tags
        - dependencies
        - forkFromSid
        - favoriteCount
        - copyCount
        - forkCount
        - createdAt
        - updatedAt
      properties:
        sid:
          type: string
          description: Stable internal identifier.
        slug:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 60
        intro:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"
        language:
          oneOf:
            - $ref: "#/components/schemas/Language"
            - type: "null"
        group:
          oneOf:
            - $ref: "#/components/schemas/GroupReference"
            - type: "null"
        tags:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/Tag"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
        forkFromSid:
          type:
            - string
            - "null"
        favoriteCount:
          type: integer
          minimum: 0
        copyCount:
          type: integer
          minimum: 0
        forkCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Snippet:
      type: object
      description: A complete snippet, including its code body.
      required:
        - sid
        - slug
        - name
        - intro
        - visibility
        - code
        - language
        - group
        - tags
        - dependencies
        - forkFromSid
        - favoriteCount
        - copyCount
        - forkCount
        - createdAt
        - updatedAt
      properties:
        sid:
          type: string
          description: Stable internal identifier.
        slug:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 60
        intro:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"
        code:
          type: string
          description: Code body, at most 1,048,576 UTF-8 bytes.
        language:
          oneOf:
            - $ref: "#/components/schemas/Language"
            - type: "null"
        group:
          oneOf:
            - $ref: "#/components/schemas/GroupReference"
            - type: "null"
        tags:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/Tag"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
        forkFromSid:
          type:
            - string
            - "null"
        favoriteCount:
          type: integer
          minimum: 0
        copyCount:
          type: integer
          minimum: 0
        forkCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Group:
      type: object
      required:
        - sid
        - slug
        - name
        - intro
        - visibility
        - tags
        - snippetCount
        - forkFromSid
        - favoriteCount
        - forkCount
        - createdAt
        - updatedAt
      properties:
        sid:
          type: string
        slug:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 60
        intro:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"
        tags:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/Tag"
        snippetCount:
          type: integer
          minimum: 0
        forkFromSid:
          type:
            - string
            - "null"
        favoriteCount:
          type: integer
          minimum: 0
        forkCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
        - hasMore
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    UserSummary:
      type: object
      required:
        - uuid
        - username
        - nickname
      properties:
        uuid:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
    ApiKeySummary:
      type: object
      required:
        - sid
        - name
        - permissions
        - expiresAt
        - lastUsedAt
      properties:
        sid:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
          description: null when the key never expires.
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Updated at most once per minute while the key is used.
    CreateSnippetRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - language
        - code
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        intro:
          type: string
          maxLength: 500
          default: ""
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 40
        language:
          type: string
          description: Language slug from the public language catalog.
        visibility:
          $ref: "#/components/schemas/Visibility"
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 32
        dependencies:
          type: array
          items:
            type: string
          description: Dependency slugs associated with the selected language. The server deduplicates
            the list and accepts at most 50 unique values.
        group:
          type: string
          description: Optional group slug owned by the same account. Use an empty string or omit for no group.
        code:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Code body. The server enforces the 1,048,576-byte UTF-8 limit.
      example:
        name: PrimeVue theme token
        intro: Read the active primary color
        slug: primevue-theme-token
        language: typescript
        visibility: private
        tags:
          - vue
          - primevue
        dependencies:
          - primevue
        code: const color = getComputedStyle(document.documentElement).getPropertyValue('--p-primary-color')
    UpdateSnippetRequest:
      type: object
      additionalProperties: false
      description: Partial update. Omitted fields keep their current values.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        intro:
          type: string
          maxLength: 500
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 40
        language:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 32
        dependencies:
          type: array
          items:
            type: string
          description: Replacement dependency slugs associated with the selected language. The server
            deduplicates the list and accepts at most 50 unique values.
        group:
          type: string
        code:
          type: string
          minLength: 1
          maxLength: 1048576
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        intro:
          type: string
          maxLength: 500
          default: ""
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 40
        visibility:
          $ref: "#/components/schemas/Visibility"
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 32
      example:
        name: Vue patterns
        intro: Reusable Vue examples
        slug: vue-patterns
        visibility: private
        tags:
          - vue
    UpdateGroupRequest:
      type: object
      additionalProperties: false
      description: Partial update. Omitted fields keep their current values.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        intro:
          type: string
          maxLength: 500
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 40
        visibility:
          $ref: "#/components/schemas/Visibility"
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 32
    MeResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - user
            - apiKey
          properties:
            user:
              $ref: "#/components/schemas/UserSummary"
            apiKey:
              $ref: "#/components/schemas/ApiKeySummary"
    SnippetResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Snippet"
    SnippetListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SnippetSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
    SnippetWriteResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Snippet"
        meta:
          type: object
          description: POST returns deduplicated; PATCH returns previousSlug and slugChanged.
          properties:
            deduplicated:
              type: boolean
            previousSlug:
              type: string
            slugChanged:
              type: boolean
    GroupResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Group"
    GroupListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        pagination:
          $ref: "#/components/schemas/Pagination"
    GroupWriteResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Group"
        meta:
          type: object
          description: POST returns deduplicated; PATCH returns previousSlug and slugChanged.
          properties:
            deduplicated:
              type: boolean
            previousSlug:
              type: string
            slugChanged:
              type: boolean
    DeleteResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - ok
            - slug
          properties:
            ok:
              type: boolean
              const: true
            slug:
              type: string
    ApiInfoResponse:
      type: object
      required:
        - name
